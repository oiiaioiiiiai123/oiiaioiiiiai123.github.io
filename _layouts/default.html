<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% include social-meta.html %}
  <link rel="icon" type="image/png" href="{{ '/assets/images/pig/pig-original.png' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/js/theme-init.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.layout == 'post' %}<link rel="stylesheet" href="{{ '/assets/css/reading.css' | relative_url }}">{% endif %}
  <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
  {% if page.pig %}<link rel="stylesheet" href="{{ '/assets/css/pig.css' | relative_url }}?v={{ site.time | date: '%s' }}"><script defer src="{{ '/assets/js/pig.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>{% endif %}
  {% if page.layout == 'project' %}<link rel="stylesheet" href="{{ '/assets/css/project.css' | relative_url }}"><script defer src="{{ '/assets/js/project.js' | relative_url }}"></script>{% endif %}
  {% if page.layout == 'post' %}<script defer src="{{ '/assets/js/reading.js' | relative_url }}"></script>{% endif %}
</head>
<body class="page-{{ page.section | default: 'other' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    {% include nav.html %}
    <main id="main" tabindex="-1">{{ content }}</main>
    {% include footer.html %}
  </div>
</body>
</html>
